[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sieg-comum"
version = "0.1.0"
description = "Integracoes compartilhadas do SIEG usadas pelas automacoes"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50",
    "google-api-python-client>=2.198",
    "google-auth>=2.56",
    "google-auth-httplib2>=0.4",
    "google-auth-oauthlib>=1.4",
    "python-docx>=1.2",
]

[tool.setuptools]
packages = ["sieg_comum"]
package-dir = { sieg_comum = "." }
